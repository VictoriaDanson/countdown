<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>测试网页</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="page">
      <header class="header">
        <div>
          <h1 class="title">倒计时</h1>
          <p class="subtitle">新增、保存、刷新不丢失</p>
        </div>
      </header>

      <main class="grid">
        <section class="card">
          <h2 class="cardTitle">添加新倒计时</h2>
          <form id="countdownForm" class="form" autocomplete="off">
            <label class="field">
              <span class="label">标题</span>
              <input
                id="titleInput"
                class="input"
                type="text"
                maxlength="40"
                placeholder="例如：生日 / 假期 / 项目截止"
                required
              />
            </label>

            <div class="row">
              <label class="field">
                <span class="label">目标日期</span>
                <input id="dateInput" class="input" type="date" required />
              </label>

              <label class="field">
                <span class="label">目标时间</span>
                <input id="timeInput" class="input" type="time" required />
              </label>
            </div>

            <div class="actions">
              <button id="saveBtn" class="btn primary" type="submit">保存倒计时</button>
              <button id="clearBtn" class="btn ghost" type="button" title="清空输入">
                清空
              </button>
            </div>

            <p id="formHint" class="hint" role="status" aria-live="polite"></p>
          </form>
        </section>

        <section class="card">
          <div class="cardHeader">
            <h2 class="cardTitle">我的倒计时</h2>
            <div class="cardHeaderRight">
              <button
                id="sortBtn"
                class="iconBtn"
                type="button"
                title="按目标时间排序（最近的在前）"
              >
                按时间排序
              </button>
              <div class="chip" id="countChip" aria-label="倒计时数量">0</div>
            </div>
          </div>

          <div id="emptyState" class="empty">
            <div class="emptyTitle">还没有倒计时</div>
            <div class="emptyDesc">左侧添加一个，保存后刷新页面也不会丢失。</div>
          </div>

           <ul id="countdownList" class="list" aria-label="倒计时列表"></ul>
        </section>
      </main>

      <footer class="footer">
        <span>数据保存在本地浏览器（localStorage）</span>
      </footer>
    </div>

    <script src="./script.js" defer></script>
  </body>
</html>
